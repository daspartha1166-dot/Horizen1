
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Horizen-final.zip -d extracted
          GRADLEW_PATH="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin Compose import
        run: |
          FILE="$PROJECT_DIR/app/src/main/kotlin/com/metrolist/music/ui/component/DownloadComponents.kt"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: DownloadComponents.kt not found"
            exit 1
          fi
          if ! grep -q '^import androidx.compose.runtime.getValue$' "$FILE"; then
            sed -i '/^package /a import androidx.compose.runtime.getValue' "$FILE"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build FOSS APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizen1-debug-apk
          path: "*.apk"
          if-no-files-found: error
          retention-days: 7
          
