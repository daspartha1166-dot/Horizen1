pipeline:
  id: pipeline_daspartha1166_dot_Horizen1_build_0d46
  name: pipeline_daspartha1166_dot_Horizen1_build_0d46
  stages:
    - name: Build APK
      id: build_apk
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - name: Extract and Build APK
          id: extract_and_build
          run:
            shell: bash
            script: |-
              export CI=true
              unzip -q Horizen-final.zip -d extracted
              GRADLEW_PATH="$(find extracted -type f -name gradlew -print -quit)"
              if [ -z "$GRADLEW_PATH" ]; then
                echo "ERROR: gradlew not found in ZIP"
                exit 1
              fi
              PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

              FILE="$PROJECT_DIR/app/src/main/kotlin/com/metrolist/music/ui/component/DownloadComponents.kt"
              if [ -f "$FILE" ]; then
                if ! grep -q '^import androidx.compose.runtime.getValue$' "$FILE"; then
                  sed -i '/^package /a import androidx.compose.runtime.getValue' "$FILE"
                fi
              fi

              sudo apt-get update -qq
              sudo apt-get install -y -qq openjdk-17-jdk
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$PATH"
              java -version

              mkdir -p "$HOME/.android"
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"

              cd "$PROJECT_DIR"
              chmod +x gradlew
              ./gradlew :app:assembleFossDebug
  tags:
    onboarding: "true"
